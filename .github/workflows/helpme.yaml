name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# TODO#0: Declare workflow permissions.
permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write  # required to upload SARIF to GitHub Security tab
  actions: read

jobs:
    # GATE#0: Secret scanning (TruffleHog + Gitleaks)
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                # TODO#1: Fetch full history
                fetch-depth: 0

            - name: Run TruffleHog
              uses: trufflesecurity/trufflehog@main
              continue-on-error: true
              with:
                path: ./
                # TODO#2 & #3: Base/Head + Only verified
                base: ${{ github.event.repository.default_branch }}
                head: HEAD
                extra_args: --only-verified

            # TODO#4: Gitleaks step
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              continue-on-error: true
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
                GITLEAKS_ENABLE_SUMMARY: "true"

    # GATE#1a: SAST via SonarQube 
    sast-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }} 
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                # TODO#5: Full history for Sonar
                fetch-depth: 0

            # TODO#6: SonarQube Scan
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v7.1.0
              continue-on-error: true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # GATE#1b: SAST via CodeQL (results in GitHub Security tab)
    codeql-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }} 
        strategy:
            matrix:
                # TODO#7: Language for Next.js / React
                language: [ 'javascript-typescript' ]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                languages: ${{ matrix.language }}
                # TODO#8: enable extended security + quality query suites
                queries: security-extended,security-and-quality

            # TODO#9: Analyze step
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                category: "/language:${{ matrix.language }}"

    # GATE#2: Dependency scanning via OWASP Dependency-Check (SARIF + HTML)
    dependency-scanning:
        runs-on: ubuntu-latest
        needs: [sast-scan, secret-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # TODO#10: Set up Node 20
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            # TODO#11: Install dependencies
            - name: Install dependencies
              run: npm install

            - name: Depcheck
              uses: dependency-check/Dependency-Check_Action@main
              continue-on-error: true
              id: Depcheck
              with:
                project: 'DontEverPushThisCodeV2'
                path: '.'
                # TODO#12: format for Security tab
                format: 'SARIF'
                out: 'reports'
                # TODO#13: CVSS threshold (7 = HIGH)
                args: >
                    --failOnCVSS 7
                    --enableRetired

            # TODO#14: Upload Depcheck SARIF
            - name: Upload Depcheck SARIF to Security tab
              if: always() 
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                  sarif_file: reports/dependency-check-report.sarif
                  category: dependency-check

            # TODO#15: Upload raw report folder
            - name: Upload Depcheck HTML report as artifact
              if: always() 
              uses: actions/upload-artifact@v4
              with:
                name: depcheck-report
                path: reports/

    # GATE#3: Container/Image scanning via Trivy (SARIF + artifact)
    image-scanning:
        runs-on: ubuntu-latest
        needs: [dependency-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # TODO#16: Build docker image
            - name: Build Docker image
              run: docker build -t my-app:latest .

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@master
              continue-on-error: true
              with:
                image-ref: 'my-app:latest'
                # TODO#17: output format
                format: 'sarif'
                output: 'trivy-results.sarif'
                # TODO#18: Severities
                severity: 'CRITICAL,HIGH'
                # TODO#19: Include unfixable or not
                ignore-unfixed: false

            # TODO#20: Upload Trivy SARIF
            - name: Upload Trivy SARIF to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                sarif_file: 'trivy-results.sarif'
                category: 'trivy'

            # TODO#21: Upload Trivy SARIF artifact
            - name: Upload Trivy results as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: trivy-results
                path: 'trivy-results.sarif'